        <path d="M298 203h20m0 0-6-6m6 6-6 6"/>
        <path d="M322 217h-20m0 0 6-6m-6 6 6 6"/>
      </g>
      <path d="M358 118V92" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M358 92l18 7-18 7z" fill="#fff"/>
    </g>

    <g fill="#fff">
      <circle cx="40" cy="210" r="5"/><circle cx="578" cy="210" r="5"/>
      <circle cx="60" cy="110" r="4"/><circle cx="60" cy="316" r="4"/>
      <circle cx="560" cy="118" r="4"/><circle cx="560" cy="302" r="4"/>
    </g>
  </g>

  <g>
    <rect x="470" y="352" width="118" height="40" rx="12" fill="#fff" stroke="#ececec" stroke-width="1.5"/>
    <circle cx="492" cy="372" r="8" fill="none" stroke="#171717" stroke-width="2.4"/>
    <circle cx="492" cy="372" r="3" fill="#171717"/>
    <text x="508" y="377" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#171717">IP Ready</text>
  </g>
