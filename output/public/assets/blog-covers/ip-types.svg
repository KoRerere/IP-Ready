<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 416" role="img" aria-label="Choosing between datacenter, residential, and mobile IP">
  <defs>
    <pattern id="cv2-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="rgba(23,23,23,.05)"/>
    </pattern>
  </defs>

  <rect width="620" height="416" fill="#fbfcfb"/>
  <rect width="620" height="416" fill="url(#cv2-dots)"/>

  <circle cx="84" cy="86" r="6" fill="#1dc94d" opacity=".3"/>
  <circle cx="552" cy="320" r="7" fill="#1dc94d" opacity=".22"/>

  <!-- 磁贴 1：数据中心 -->
  <g>
    <rect x="96" y="104" width="128" height="164" rx="18" fill="#fff" stroke="#e0e0e2" stroke-width="2.5"/>
    <rect x="118" y="130" width="84" height="112" rx="9" fill="#171717"/>
    <g>
      <rect x="127" y="144" width="66" height="18" rx="4" fill="#2c2c2c"/>
      <circle cx="136" cy="153" r="2.6" fill="#1dc94d"/>
      <rect x="144" y="151" width="40" height="4" rx="2" fill="#3f3f3f"/>
      <rect x="127" y="170" width="66" height="18" rx="4" fill="#2c2c2c"/>
      <circle cx="136" cy="179" r="2.6" fill="#1dc94d" opacity=".4"/>
      <rect x="144" y="177" width="40" height="4" rx="2" fill="#3f3f3f"/>
      <rect x="127" y="196" width="66" height="18" rx="4" fill="#2c2c2c"/>
      <circle cx="136" cy="205" r="2.6" fill="#1dc94d"/>
      <rect x="144" y="203" width="40" height="4" rx="2" fill="#3f3f3f"/>
      <rect x="127" y="222" width="66" height="14" rx="4" fill="#2c2c2c"/>
    </g>
    <rect x="134" y="292" width="52" height="20" rx="10" fill="#f1f4f1"/>
    <text x="160" y="306" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#7b7b7b">IDC</text>
  </g>

  <!-- 磁贴 2：静态住宅（选中态） -->
  <g>
    <rect x="234" y="92" width="152" height="188" rx="22" fill="none" stroke="#1dc94d" stroke-width="3"/>
    <rect x="246" y="104" width="128" height="164" rx="18" fill="#fff" stroke="#e0e0e2" stroke-width="2.5"/>
    <!-- 小房子 -->
    <polygon points="266,204 310,168 354,204" fill="#087a32"/>
    <rect x="272" y="204" width="76" height="52" rx="4" fill="#fff" stroke="#e0e0e2" stroke-width="2.2"/>
    <rect x="284" y="216" width="22" height="20" rx="3" fill="#ffe3a6"/>
    <rect x="314" y="216" width="22" height="20" rx="3" fill="#ffe3a6"/>
    <rect x="300" y="228" width="18" height="28" rx="3" fill="#1dc94d"/>
    <circle cx="280" cy="150" r="13" fill="#1dc94d"/>
    <circle cx="280" cy="150" r="5" fill="#fff"/>
    <!-- 选中徽章 -->
    <circle cx="382" cy="108" r="17" fill="#1dc94d"/>
    <path d="M374 108l5.5 5.5 10-10.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="284" y="292" width="52" height="20" rx="10" fill="rgba(29,201,77,.14)"/>
    <text x="310" y="306" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#087a32">HOME</text>
  </g>

  <!-- 磁贴 3：移动 -->
  <g>
    <rect x="396" y="104" width="128" height="164" rx="18" fill="#fff" stroke="#e0e0e2" stroke-width="2.5"/>
    <g stroke="#171717" stroke-width="2.6" stroke-linecap="round">
      <path d="M440 250 458 158M508 250 470 158"/>
      <path d="M444 236h60M449 220h50M454 204h40M459 188h30" stroke-width="1.8" opacity=".8"/>
      <path d="M464 158V140"/>
    </g>
    <rect x="440" y="130" width="9" height="22" rx="4" fill="#171717" transform="rotate(16 444 141)"/>
    <rect x="479" y="130" width="9" height="22" rx="4" fill="#171717" transform="rotate(-16 483 141)"/>
    <path d="M428 138a26 26 0 0 0 0 40" fill="none" stroke="#1dc94d" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M418 128a42 42 0 0 0 0 60" fill="none" stroke="#1dc94d" stroke-width="3.4" stroke-linecap="round" opacity=".45"/>
    <rect x="434" y="292" width="52" height="20" rx="10" fill="#f1f4f1"/>
    <text x="460" y="306" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#7b7b7b">MOBILE</text>
  </g>

  <circle cx="76" cy="320" r="5" fill="#1dc94d" opacity=".3"/>
  <circle cx="560" cy="84" r="6" fill="#1dc94d" opacity=".3"/>
</svg>
