<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 416" role="img" aria-label="90 day risk score history line chart">
  <defs>
    <pattern id="cv4-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="rgba(23,23,23,.05)"/>
    </pattern>
  </defs>

  <rect width="620" height="416" fill="#fbfcfb"/>
  <rect width="620" height="416" fill="url(#cv4-dots)"/>

  <circle cx="80" cy="88" r="6" fill="#1dc94d" opacity=".3"/>
  <circle cx="556" cy="74" r="6" fill="#1dc94d" opacity=".3"/>
  <circle cx="86" cy="330" r="5" fill="#1dc94d" opacity=".35"/>

  <!-- 主趋势卡 -->
  <g>
    <rect x="70" y="84" width="330" height="248" rx="16" fill="#fff" stroke="#e0e0e2" stroke-width="2.5"/>
    <rect x="90" y="106" width="64" height="18" rx="9" fill="#f1f4f1"/>
    <text x="122" y="118" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#7b7b7b">90 DAYS</text>
    <rect x="90" y="138" width="104" height="10" rx="5" fill="#ececec"/>
    <!-- 网格线 -->
    <g stroke="#ececec" stroke-width="2" stroke-dasharray="3 5">
      <path d="M90 196H380"/>
      <path d="M90 236H380"/>
      <path d="M90 276H380"/>
    </g>
    <!-- 折线（从高风险下降） -->
    <path d="M96 170 C 150 164, 190 186, 236 204 S 330 258, 374 284" fill="none" stroke="#1dc94d" stroke-width="6" stroke-linecap="round"/>
    <circle cx="236" cy="204" r="7" fill="#1dc94d"/>
    <circle cx="236" cy="204" r="3" fill="#fff"/>
    <circle cx="96" cy="170" r="5" fill="#cfd6cf"/>
    <circle cx="374" cy="284" r="6" fill="#087a32"/>
    <!-- 底部时间条 -->
    <rect x="90" y="300" width="290" height="12" rx="6" fill="#f1f1f1"/>
    <circle cx="100" cy="306" r="3.2" fill="#1dc94d"/>
    <circle cx="260" cy="306" r="3.2" fill="#cfd6cf"/>
    <circle cx="368" cy="306" r="3.2" fill="#087a32"/>
  </g>

  <!-- 右侧差值徽章 -->
  <g>
    <rect x="424" y="132" width="126" height="152" rx="16" fill="#fff" stroke="#e0e0e2" stroke-width="2.5"/>
    <rect x="442" y="154" width="58" height="8" rx="4" fill="#ececec"/>
    <text x="487" y="212" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#171717">-18</text>
    <text x="487" y="238" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#7b7b7b">pts</text>
    <rect x="452" y="252" width="70" height="16" rx="8" fill="rgba(29,201,77,.16)"/>
    <text x="487" y="264" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#087a32">CLEANER</text>
  </g>

  <!-- 底部进度条 -->
  <g>
    <rect x="424" y="308" width="126" height="22" rx="11" fill="#e8ece8"/>
    <rect x="424" y="308" width="76" height="22" rx="11" fill="#1dc94d"/>
  </g>
</svg>
