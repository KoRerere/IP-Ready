<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 416" role="img" aria-label="Residential network connection diagram">
  <defs>
    <pattern id="cv5-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="rgba(23,23,23,.05)"/>
    </pattern>
  </defs>

  <rect width="620" height="416" fill="#fbfcfb"/>
  <rect width="620" height="416" fill="url(#cv5-dots)"/>

  <circle cx="86" cy="80" r="6" fill="#1dc94d" opacity=".3"/>
  <circle cx="552" cy="336" r="7" fill="#1dc94d" opacity=".22"/>

  <!-- 连接线：路由器 → 家 → 设备 -->
  <g fill="none" stroke="#1dc94d" stroke-width="2.8" stroke-dasharray="1 9" stroke-linecap="round" opacity=".8">
    <path d="M148 218 C 180 218, 196 210, 216 200"/>
    <path d="M372 200 C 398 210, 418 214, 452 214"/>
  </g>

  <!-- 路由器 -->
  <g>
    <rect x="58" y="150" width="104" height="136" rx="14" fill="#fff" stroke="#e0e0e2" stroke-width="2.5"/>
    <g stroke="#171717" stroke-width="2.4" stroke-linecap="round">
      <path d="M112 236V176"/>
      <path d="M116 236h-8M118 218h-14M120 200h-18M122 182h-22" opacity=".7"/>
    </g>
    <rect x="102" y="154" width="7" height="18" rx="3.5" fill="#171717" transform="rotate(14 105 163)"/>
    <rect x="118" y="154" width="7" height="18" rx="3.5" fill="#171717" transform="rotate(-14 121 163)"/>
    <rect x="86" y="252" width="48" height="7" rx="3.5" fill="#1dc94d"/>
  </g>

  <!-- 中央住宅（选中态） -->
  <g>
    <rect x="196" y="96" width="180" height="224" rx="22" fill="none" stroke="#1dc94d" stroke-width="3"/>
    <rect x="208" y="108" width="156" height="200" rx="18" fill="#fff" stroke="#e0e0e2" stroke-width="2.5"/>
    <!-- 小房子 -->
    <polygon points="232,232 286,188 340,232" fill="#087a32"/>
    <rect x="240" y="232" width="92" height="62" rx="4" fill="#fff" stroke="#e0e0e2" stroke-width="2.2"/>
    <rect x="254" y="246" width="26" height="24" rx="3" fill="#ffe3a6"/>
    <rect x="292" y="246" width="26" height="24" rx="3" fill="#ffe3a6"/>
    <rect x="274" y="260" width="22" height="34" rx="3" fill="#1dc94d"/>
    <circle cx="248" cy="158" r="13" fill="#1dc94d"/>
    <circle cx="248" cy="158" r="5" fill="#fff"/>
    <!-- 选中徽章 -->
    <circle cx="362" cy="112" r="17" fill="#1dc94d"/>
    <path d="M354 112l5.5 5.5 10-10.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="248" y="288" width="64" height="22" rx="11" fill="rgba(29,201,77,.14)"/>
    <text x="280" y="303" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#087a32">HOME</text>
  </g>

  <!-- 右侧笔记本 -->
  <g>
    <rect x="460" y="158" width="112" height="130" rx="14" fill="#fff" stroke="#e0e0e2" stroke-width="2.5"/>
    <rect x="476" y="174" width="80" height="8" rx="4" fill="#ececec"/>
    <rect x="476" y="192" width="56" height="8" rx="4" fill="#ececec"/>
    <circle cx="496" cy="230" r="11" fill="#1dc94d"/>
    <circle cx="496" cy="230" r="4" fill="#fff"/>
    <rect x="516" y="222" width="40" height="16" rx="8" fill="rgba(29,201,77,.16)"/>
    <text x="536" y="234" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#087a32">OK</text>
    <rect x="476" y="256" width="80" height="12" rx="6" fill="#f1f1f1"/>
  </g>

  <circle cx="438" cy="330" r="5" fill="#1dc94d" opacity=".3"/>
  <circle cx="560" cy="86" r="6" fill="#1dc94d" opacity=".3"/>
</svg>
