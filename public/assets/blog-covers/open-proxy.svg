<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 416" role="img" aria-label="Traffic passing through a flagged relay node">
  <defs>
    <pattern id="op-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="rgba(23,23,23,.05)"/>
    </pattern>
    <linearGradient id="op-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fe0d0"/>
      <stop offset="1" stop-color="#63a8ff"/>
    </linearGradient>
    <radialGradient id="op-a"><stop offset="0" stop-color="#25c9a8" stop-opacity=".8"/><stop offset="1" stop-color="#25c9a8" stop-opacity="0"/></radialGradient>
    <radialGradient id="op-b"><stop offset="0" stop-color="#4f8dff" stop-opacity=".7"/><stop offset="1" stop-color="#4f8dff" stop-opacity="0"/></radialGradient>
    <radialGradient id="op-c"><stop offset="0" stop-color="#b0ff7a" stop-opacity=".6"/><stop offset="1" stop-color="#b0ff7a" stop-opacity="0"/></radialGradient>
    <filter id="op-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="52"/></filter>
    <clipPath id="op-clip"><rect x="22" y="22" width="576" height="372" rx="18"/></clipPath>
  </defs>

  <rect width="620" height="416" fill="#fbfcfb"/>
  <rect width="620" height="416" fill="url(#op-dots)"/>

  <rect x="22" y="22" width="576" height="372" rx="18" fill="url(#op-base)"/>
  <g clip-path="url(#op-clip)">
    <g filter="url(#op-soft)">
      <ellipse cx="140" cy="130" rx="210" ry="150" fill="url(#op-a)"/>
      <ellipse cx="510" cy="290" rx="210" ry="150" fill="url(#op-b)"/>
      <ellipse cx="420" cy="80" rx="160" ry="110" fill="url(#op-c)"/>
    </g>

    <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
      <path d="M40 210h180" stroke-dasharray="2 10"/>
      <path d="M400 210h178" stroke-dasharray="2 10"/>
      <path d="M60 110c90 20 150 50 200 76" stroke-dasharray="10 12" opacity=".85"/>
      <path d="M60 316c90-24 150-56 200-82" stroke-dasharray="10 12" opacity=".85"/>
      <path d="M420 128c70 12 130 10 178-8" stroke-dasharray="10 12" opacity=".85"/>
      <path d="M420 296c70-14 130-16 178 2" stroke-dasharray="10 12" opacity=".85"/>
    </g>

    <g>
      <circle cx="310" cy="210" r="46" fill="#fff" opacity=".18"/>
      <circle cx="310" cy="210" r="30" fill="none" stroke="#fff" stroke-width="2.6"/>
